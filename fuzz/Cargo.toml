[package]
name = "transformers-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.92"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.12"
transformers = { path = "..", default-features = false, features = ["std", "flex", "chat-templates"] }
burn = { version = "=0.21.0", default-features = false, features = ["std", "flex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Official parser used as a differential oracle; the runtime crate pins the same release.
safetensors = { version = "=0.7.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_artifacts"
path = "fuzz_targets/index_artifacts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "masks_positions"
path = "fuzz_targets/masks_positions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_transactions"
path = "fuzz_targets/cache_transactions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generation"
path = "fuzz_targets/generation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "experiment_interfaces"
path = "fuzz_targets/experiment_interfaces.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logits_processing"
path = "fuzz_targets/logits_processing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chat_templates"
path = "fuzz_targets/chat_templates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rope_parameters"
path = "fuzz_targets/rope_parameters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safetensors_headers"
path = "fuzz_targets/safetensors_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attention_connectivity"
path = "fuzz_targets/attention_connectivity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modular_specs"
path = "fuzz_targets/modular_specs.rs"
test = false
doc = false
bench = false

# Keep fuzz-only dependencies and sanitizer artifacts outside the runtime package.
[workspace]
members = ["."]

# Configuration arithmetic must reject overflow even in optimized campaigns.
[profile.release]
overflow-checks = true

