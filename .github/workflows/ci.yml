# Continuous integration for the transformers crate.
#
# Every job runs on CPU. GPU kernels, real checkpoints, and downloaded paper
# artifacts are out of scope; RELEASE_GATES.md lists those hardware gates.
#
# Feature coverage:
# - macOS lints `--all-features`, as AGENTS.md prescribes for an equipped host.
# - Linux lints every feature except `metal`, `kernel-tracing`, and
#   `attention-kernel-tracing`, which select Apple's Metal API. `cuda` and
#   `rocm` compile there without vendor toolkits: cudarc falls back to its
#   newest bindings with runtime library loading, and cubecl-hip-sys to its
#   newest HIP bindings when no `hipconfig` is installed. Neither is linked or
#   executed by a lint. `cpu` (CubeCL's MLIR backend) downloads a prebuilt
#   LLVM in its build script.
#
# Known gaps are tracked, not hidden. Four fuzz-oracle tests that predate
# wave-3 behavior are skipped by exact name, and a second step fails once any
# of them passes again. The documentation audit runs as a ratchet against the
# gaps that remain in src/ and fuzz/. Both lists only shrink, and the release
# gate (scripts/check_release.py --gate source) still requires zero.
#
# The Verus proofs need a pinned prover release and its own Rust toolchain;
# start them from the Actions tab ("Run workflow", then tick "verus"). All
# harnesses verified in 12 seconds on the development Mac once installed.

name: CI

on:
  push:
    branches: [main, codex/transformers]
  pull_request:
  schedule:
    # Weekly, to surface new advisories and stable-toolchain lints early.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      verus:
        description: Also run the Verus proofs (macOS; downloads the pinned 450 MB release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Every CPU feature; the source gate in scripts/check_release.py uses the same set.
  CPU_FEATURES: std,flex,tokenizers,chat-templates,autodiff,train

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path scripts/coverage-layout/Cargo.toml --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every feature except the Apple Metal ones (see the header).
          - os: ubuntu-latest
            features: --no-default-features --features std,flex,cpu,cuda,rocm,tokenizers,chat-templates,autodiff,train
          - os: macos-latest
            features: --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Minimal feature sets
        if: runner.os == 'Linux'
        run: |
          cargo check --locked --no-default-features
          cargo check --locked --no-default-features --features std

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Library, integration, and documentation tests with default features.
      # Checkpoint and hardware tests are #[ignore]d and need local artifacts.
      - name: Default features
        run: cargo test --locked
      # Adds the autodiff gradient tests (a superset of
      # `cargo test --features autodiff --lib`) and the tokenizer,
      # chat-template, and training tests that default features compile out.
      - name: Every CPU feature
        run: |
          cargo test --locked --no-default-features --features "$CPU_FEATURES" --lib --tests
          cargo test --locked --no-default-features --features "$CPU_FEATURES" --doc
      # qwen35_chat needs Metal to build; its argument tests create no device.
      - name: Metal example argument tests
        if: runner.os == 'macOS'
        run: cargo test --locked --no-default-features --features std,metal,chat-templates --example qwen35_chat

  msrv:
    name: MSRV (Rust 1.92)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      # Compilation only; the release MSRV gate (check_release.py --gate msrv)
      # also runs the tests on 1.92.
      - name: Check every target
        run: cargo +1.92.0 check --locked --all-targets --no-default-features --features "$CPU_FEATURES"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # The docs.rs feature set from Cargo.toml's package.metadata.
      - run: cargo doc --locked --no-deps --no-default-features --features std,flex,tokenizers,chat-templates

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build every CPU example
        run: cargo build --release --locked --examples --no-default-features --features "$CPU_FEATURES"
      - name: Tests embedded in examples
        run: cargo test --release --locked --examples --no-default-features --features "$CPU_FEATURES"
      # Download-free examples with their own numerical assertions. Training
      # examples run their short modes; full studies are documented separately.
      - name: Run download-free examples
        run: |
          run() { cargo run --release --locked --no-default-features --features "$CPU_FEATURES" --example "$@"; }
          run activation_workbench
          run attention_head_attribution
          run custom_composition
          run custom_composition -- --train
          run t5_classifier
          run t5_classifier -- --train
          run mla_encoder_decoder
          run mla_encoder_decoder -- --train
          run qwen_prefix -- --random
          run train_qwen_adapter
          run burn_training -- "$RUNNER_TEMP/burn_training"
          run grokking_train -- --steps 10 --output "$RUNNER_TEMP/grokking"
          run clock_and_pizza_train -- --smoke --output "$RUNNER_TEMP/clock_and_pizza"

  tooling:
    name: Python tooling and coverage classifier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The maintainer reference environment; tomllib needs 3.11 or newer.
          python-version: "3.11"
      - name: Python tooling tests
        run: |
          python3 - <<'EOF'
          """Run scripts/tests like `python3 -m unittest discover -s scripts/tests -v`.

          Tests that verify the maintainer's pinned reference environment
          (PyTorch, NumPy, Transformers 5.2.0, and exact installed-wheel
          METADATA/RECORD hashes, which embed machine-specific script paths)
          cannot pass on a clean runner and are skipped by exact test ID. A
          listed ID that no longer exists fails the run, so the list cannot go
          stale.
          """
          import sys
          import unittest

          REFERENCE_ENVIRONMENT = {
              "test_generate_flan_t5_small_reference.FlanSmallReferenceTests.test_exact_package_versions_are_available",
              "test_generate_flan_t5_small_reference.FlanSmallReferenceTests.test_tensor_wire_format_and_parity_are_strict",
              "test_generate_flan_t5_xxl_reference.ReferenceHelperTests.test_generation_config_records_defaults_and_explicit_overrides",
              "test_generate_flan_t5_xxl_reference.ReferenceHelperTests.test_package_and_reference_sources_match_prepared_environment",
              "test_generate_flan_t5_xxl_reference.ReferenceHelperTests.test_tensor_parity_is_elementwise_not_only_cosine",
              "test_generate_flan_t5_xxl_reference.ReferenceHelperTests.test_tensor_payload_is_finite_shaped_little_endian_f32",
              "test_generate_qwen38_reference.ReferenceHelperTests.test_installed_distribution_provenance_matches_prepared_environment",
              "test_generate_qwen38_reference.ReferenceHelperTests.test_transformers_reference_sources_match_pinned_wheel",
              "test_generate_qwen3_moe_reference.ReferenceHelperTests.test_official_source_manifest_matches_installed_pinned_wheel",
          }


          def flatten(suite):
              """Yield the individual test cases of a nested unittest suite."""
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from flatten(test)
                  else:
                      yield test


          tests = list(flatten(unittest.defaultTestLoader.discover("scripts/tests")))
          missing = REFERENCE_ENVIRONMENT - {test.id() for test in tests}
          if missing:
              sys.exit(f"stale reference-environment test IDs: {sorted(missing)}")
          print(f"skipping {len(REFERENCE_ENVIRONMENT)} reference-environment tests", flush=True)
          selected = unittest.TestSuite(t for t in tests if t.id() not in REFERENCE_ENVIRONMENT)
          result = unittest.TextTestRunner(verbosity=2).run(selected)
          sys.exit(0 if result.wasSuccessful() else 1)
          EOF
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/coverage-layout
      - name: Coverage-layout classifier
        run: |
          cargo clippy --manifest-path scripts/coverage-layout/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path scripts/coverage-layout/Cargo.toml --locked
          cargo build --manifest-path scripts/coverage-layout/Cargo.toml --locked
      - name: Documentation standards (no new gaps)
        run: |
          report="$RUNNER_TEMP/documentation.json"
          rm -f "$report"
          audit_status=0
          python3 scripts/check_documentation.py --standards \
            --classifier scripts/coverage-layout/target/debug/transformers-coverage-layout \
            --output "$report" || audit_status=$?
          python3 - "$report" "$audit_status" <<'EOF'
          """Fail on documentation gaps beyond the recorded baseline.

          `check_documentation.py --standards` exits nonzero while any authored
          item lacks its required doc comment or sits inside a macro the
          classifier cannot expand. src/ and fuzz/ still have such items, so
          that exit status cannot gate CI yet. This ratchet reads the JSON report instead
          and fails when a component has more gaps of a kind than BASELINE
          records, or when the audit reports a parse diagnostic. Lower BASELINE
          as gaps close; the release gate still requires zero.
          """
          import json
          import sys

          # component: (missing doc comments, opaque macro functions, opaque macro items)
          BASELINE = {
              "checkpoint": (1, 11, 0),
              "fuzz": (1, 0, 0),
              "models": (30, 31, 11),
              "shared": (61, 47, 0),
          }
          KINDS = ("missing_style", "unresolved_macro_functions", "unresolved_macro_items")

          report_path, status = sys.argv[1], int(sys.argv[2])
          if status == 0:
              print("documentation standards pass in full; empty BASELINE")
              sys.exit(0)
          try:
              with open(report_path, encoding="utf-8") as report_file:
                  report = json.load(report_file)
          except OSError as error:
              sys.exit(f"check_documentation.py failed before writing its report: {error}")
          failures = [
              f"diagnostic {d['code']} in {d['file']}: {d['reason']}"
              for d in report["diagnostics"]
              if d["code"] != "duplicate_context"
          ]
          inventory = report["inventory"]
          for component, counts in sorted(inventory["groups"].items()):
              allowed = dict(zip(KINDS, BASELINE.get(component, (0, 0, 0))))
              allowed["inline_test_bodies"] = 0
              for kind, limit in allowed.items():
                  if counts[kind] > limit:
                      failures.append(f"{component}: {counts[kind]} {kind} (baseline {limit})")
              print(f"{component}: " + ", ".join(f"{k} {counts[k]}/{v}" for k, v in allowed.items()))
          if failures:
              for entry in inventory["missing"]:
                  print(f"::warning file={entry['path']},line={entry['line']}::"
                        f"missing {entry['required_style']} doc on {entry['kind']} {entry['name']}")
              sys.exit("documentation gaps above the baseline:\n  " + "\n  ".join(failures))
          print("no documentation gaps above the baseline")
          EOF

  fuzz:
    name: Fuzz harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Oracles that predate wave-3 behavior and fail at this source: top-k
      # now keeps every score tied with the k-th, as Hugging Face does
      # (fuzz/src/logits_processing.rs:413-416), and modular specs now run
      # Mamba-2 (fuzz/src/modular_specs.rs:461-463). Remove each name here
      # together with its oracle fix.
      STALE_ORACLE_TESTS: >-
        logits_processing::tests::campaign_top_p_near_ties_may_split
        logits_processing::tests::pseudo_random_inputs_agree_with_the_oracles
        modular_specs::tests::capability_gaps_are_reported_at_construction
        modular_specs::tests::pseudo_random_specs_validate_construct_and_run
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The harnesses' oracle and regression tests run on stable; fuzzing
      # campaigns need nightly cargo-fuzz and are described in fuzz/README.md.
      - name: Clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings
      - name: Harness tests
        run: |
          skips=()
          for test in $STALE_ORACLE_TESTS; do skips+=(--skip "$test"); done
          cargo test --manifest-path fuzz/Cargo.toml --locked --lib -- --exact "${skips[@]}"
      # A skipped test that passes again, or no longer exists, fails here
      # until its name is removed from STALE_ORACLE_TESTS.
      - name: Skipped oracle tests still fail
        run: |
          stale=0
          for test in $STALE_ORACLE_TESTS; do
            if cargo test --manifest-path fuzz/Cargo.toml --locked --lib -- --exact "$test" > /dev/null 2>&1; then
              echo "::error::$test passes or no longer exists; remove it from STALE_ORACLE_TESTS"
              stale=1
            fi
          done
          exit "$stale"

  dependencies:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # The versions RELEASE_GATES.md reviewed; update both places together.
      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
      # The ignored IDs are unmaintained-crate notices, not vulnerabilities;
      # they match MAINTENANCE_NOTICES in scripts/check_release.py.
      - name: Advisories
        run: cargo audit --file Cargo.lock --deny warnings --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0436
      - name: Licenses and sources
        run: cargo deny --locked --config deny.toml check licenses sources

  verus:
    name: Verus proofs
    if: github.event_name == 'workflow_dispatch' && inputs.verus
    # macos-latest is Apple silicon, matching the pinned arm64 macOS release.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERUS_RELEASE: release/0.2026.10.04.426d8b0
      VERUS_ARCHIVE: verus-0.2026.10.04.426d8b0-arm64-macos.zip
      VERUS_SHA256: 83cafc50284caea07fa8762df04b00cc0af441f25cdf1631d6c30987c65af446
      VERUS_TOOLCHAIN: 1.98.1-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain the Verus release pins
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal --no-self-update
      - name: Download and verify the pinned Verus release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERUS_RELEASE" --repo verus-lang/verus \
            --pattern "$VERUS_ARCHIVE" --dir "$RUNNER_TEMP"
          echo "$VERUS_SHA256  $RUNNER_TEMP/$VERUS_ARCHIVE" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$VERUS_ARCHIVE" -d "$RUNNER_TEMP/verus"
      - name: Verify every harness
        run: |
          verus="$(find "$RUNNER_TEMP/verus" -type f -name verus -perm -u+x | head -n 1)"
          test -n "$verus" || { echo "verus binary not found in the archive"; exit 1; }
          "$verus" --version
          status=0
          for harness in verus/*.rs; do
            echo "::group::$harness"
            "$verus" --crate-type lib --no-cheating --triggers-mode silent "$harness" || status=1
            echo "::endgroup::"
          done
          exit "$status"
