# Checked with cargo-deny 0.20.2. This is a source-release inventory policy,
# not a replacement for preserving each dependency's notices in distributions.
[graph]
all-features = true

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = [
    "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0",
    "ISC", "MIT", "Unicode-3.0", "Zlib",
]

# These exceptions intentionally do not authorize future packages/versions.
# Keep the original license and source notices for these unmodified dependencies.
[[licenses.exceptions]]
crate = "colored@=3.1.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext@=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "webpki-roots@=1.0.9"
allow = ["CDLA-Permissive-2.0"]

# Advisories for the graph this crate actually builds (all of its own features).
# `cargo audit` separately checks every lockfile entry for vulnerabilities,
# including optional dependencies of Burn that no feature here activates.
[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "unmaintained notice for bincode 2.0.1, inherited from pinned Burn Core" },
    { id = "RUSTSEC-2024-0436", reason = "unmaintained notice for paste 1.0.15, a build-time macro dependency of CubeCL, Flex/GEMM, and tokenizers" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
