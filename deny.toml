# Checked with cargo-deny 0.20.2. This is a source-release inventory policy,
# not a replacement for preserving each dependency's notices in distributions.
[graph]
all-features = true

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = [
    "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0",
    "ISC", "MIT", "Unicode-3.0", "Zlib",
]

# These exceptions intentionally do not authorize future packages/versions.
# Keep the original license and source notices for these unmodified dependencies.
[[licenses.exceptions]]
crate = "colored@=3.1.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext@=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "webpki-roots@=1.0.9"
allow = ["CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
